<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                background:black;
                min-height:100vh;
                margin:0;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
                gap:15px;
            }
            h1 {
                color:white;
            }
            .red {
                color:red;
            }
            button {
                background-color:orange;
                border:none;
                border-radius:30px;
                padding:15px 100px;
            }
            .yes {
                background:blue;
                margin-top:150px;
                margin-left:none;
            }
            .no {
                background:red;
                margin-top:150px;
                margin-left:none;
            }
            .yes,.no {
                margin:0;
            }
        </style>
    </head>
    <body>
        <button><h1>ты <strong class="red">Еблан</strong></h1></button>
        <button class="no"><h1>Нет</h1></button>
        <button class="yes"><h1>Да</h1></button>
    </body>
</html>
